name: Deploy API to VPS

on:
  push:
    branches:
      - main # Runs this script every time you push to the main branch
    paths:
      - 'server/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up QEMU and Buildx so we can build ARM64 images on a standard GitHub worker
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub using secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build the ARM64 image and push it to Docker Hub
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/url-shortner-api:latest

      # SSH into your VPS and restart the server with the new image
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/short.link
            git pull origin main
            
            # Auto-create the .env file for production from the secret
            mkdir -p server
            echo "${{ secrets.PROD_ENV_FILE }}" > server/.env
            
            docker compose pull
            docker rm -f url_shortner_server || true
            docker compose up -d
