name: Deploy API to VPS

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Encode docker-compose.yml
        id: compose
        run: echo "b64=$(base64 -w0 docker-compose.yml)" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/url-shortner-api:latest
            ${{ secrets.DOCKER_USERNAME }}/url-shortner-api:sha-${{ github.sha }}

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          COMPOSE_B64: ${{ steps.compose.outputs.b64 }}
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
          IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/url-shortner-api
          SHA_TAG: sha-${{ github.sha }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: COMPOSE_B64,PROD_ENV_FILE,IMAGE_NAME,SHA_TAG
          script: |
            set -e
            mkdir -p ~/short.link/server

            echo "$COMPOSE_B64" | base64 -d > ~/short.link/docker-compose.yml
            printf '%s' "$PROD_ENV_FILE" > ~/short.link/server/.env

            cd ~/short.link

            PREV_TAG=""
            if [ -f .last-sha ]; then
              PREV_TAG="$(cat .last-sha)"
            fi

            docker compose pull
            docker compose up -d --force-recreate

            healthcheck() {
              echo "Waiting for /health..."
              for i in $(seq 1 20); do
                if docker exec url_shortner_server node -e "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" 2>/dev/null; then
                  return 0
                fi
                sleep 2
              done
              return 1
            }

            if healthcheck; then
              echo "Server healthy"
              echo "$SHA_TAG" > .last-sha
              docker image prune -f
              exit 0
            fi

            echo "Health check failed after 40s"

            if [ -z "$PREV_TAG" ]; then
              echo "No previous image recorded - manual intervention required"
              exit 1
            fi

            echo "Rolling back to $IMAGE_NAME:$PREV_TAG..."
            docker pull "$IMAGE_NAME:$PREV_TAG"
            docker tag "$IMAGE_NAME:$PREV_TAG" "$IMAGE_NAME:latest"
            docker compose up -d --force-recreate

            if healthcheck; then
              echo "Rolled back to $PREV_TAG - service restored (new code did not ship)"
              echo "$PREV_TAG" > .last-sha
              docker image prune -f
              exit 1
            fi

            echo "Rollback also failed - manual intervention required"
            exit 1
